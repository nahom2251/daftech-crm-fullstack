name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DaftechCrm
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DaftechCrm.Api/DaftechCrm.Api.csproj tests/DaftechCrm.Tests/DaftechCrm.Tests.csproj

      - name: Build
        run: dotnet build --no-restore --configuration Release src/DaftechCrm.Api/DaftechCrm.Api.csproj tests/DaftechCrm.Tests/DaftechCrm.Tests.csproj

      - name: Test
        run: dotnet test --no-build --configuration Release tests/DaftechCrm.Tests/DaftechCrm.Tests.csproj --logger "trx" --results-directory ./test-results

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: DaftechCrm/test-results

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (no push — verifies the image builds cleanly)
        uses: docker/build-push-action@v6
        with:
          context: ./DaftechCrm
          push: false
          tags: daftech-crm-api:ci
