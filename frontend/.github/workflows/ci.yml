name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daftech-crm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: daftech-crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint / type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build (production configuration)
        run: npm run build -- --configuration production

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (no push — verifies the image builds cleanly)
        uses: docker/build-push-action@v6
        with:
          context: ./daftech-crm
          push: false
          tags: daftech-crm-frontend:ci
