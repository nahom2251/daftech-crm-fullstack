services:
  # ---------- Backend API (.NET via Docker) ----------
  - type: web
    name: daftech-crm-api-new
    runtime: docker
    rootDir: api
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  # ---------- Frontend (Angular via Docker + Nginx) ----------
  - type: web
    name: daftech-crm-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: API_BASE_URL
        value: https://daftech-crm-api-new.onrender.com/api

databases:
  - name: daftech-crm-db-new
    databaseName: daftech_crm
    user: daftech
    plan: free
    region: oregon